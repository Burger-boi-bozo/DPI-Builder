name: Roadster V2 (V1 Heritage)
on:
  push:
    branches: [roadster-flight-v2]
  pull_request:
    paths: ["game/**", "tests/**", "artifacts/**", "deploy/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract bundled runtime dependencies
        run: unzip -oq artifacts/roadster-v2-deploy.zip 'game/three.module.min.js' 'game/font*.ttf'
      - name: Syntax and physics
        run: |
          node --check game/game.mjs
          node --check game/scene.mjs
          node --check game/physics.mjs
          node --test tests/*.test.mjs
      - name: Confirm offline assets
        run: |
          test -s game/three.module.min.js
          test -s game/FONTS-OFL-1.1.txt
          test -s artifacts/roadster-v2-deploy.zip