name: Roadster V2 — Experimental Flight Lab
on:
  push:
    branches: [roadster-flight-v2]
  pull_request:
    paths: ["game/**", "tests/**", "artifacts/**", "deploy/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore bundled offline assets
        run: python3 -m zipfile -e artifacts/roadster-v2-deploy.zip .
      - name: Syntax validation and suspension and flight physics regressions
        run: |
          node --check game/game.mjs
          node --check game/scene.mjs
          node --check game/physics.mjs
          node --check game/research.mjs
          node --check game/suspension.mjs
          node --check game/vehicle.mjs
          node --check game/orbit.mjs
          node --check game/engineering.mjs
          node --check game/range.mjs
          node --check game/powertrain.mjs
          node --check game/attitude.mjs
          node --test tests/*.test.mjs
      - name: Verify self-contained release assets
        run: |
          test -s game/three.module.min.js
          test -s game/FONTS-OFL-1.1.txt
          test -s game/research.mjs
          test -s game/suspension.mjs
          test -s game/vehicle.mjs
          test -s game/orbit.mjs
          test -s artifacts/roadster-v2-deploy.zip
          grep -q 'Roadster / Experimental Flight V3.3' game/index.html
          test -s tests/driveline-v29.test.mjs
          test -s tests/orbit-v30.test.mjs
          test -s tests/damper-v30.test.mjs
          test -s tests/engineering-v31.test.mjs
          test -s game/engineering.mjs
          test -s game/range.mjs
          test -s game/powertrain.mjs
          test -s game/attitude.mjs
          test -s tests/powertrain-v33.test.mjs
          test -s tests/attitude-v33.test.mjs
          test -s tests/handling-v32.test.mjs
          test -s tests/models-v32.test.mjs